<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Module scripts are deferred: they run after the document has been parsed. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="container">
      <h1>Task Manager</h1>
      <p class="subtitle">Enterprise Task Management &amp; QA Automation Lab</p>
    </div>
  </header>

  <main id="main" class="container">
    <!-- Announced by screen readers whenever its text changes. -->
    <div id="message" class="message" data-testid="message" role="status" aria-live="polite" hidden></div>

    <section aria-labelledby="tasks-heading">
      <div class="toolbar">
        <h2 id="tasks-heading">Tasks</h2>
      </div>

      <form id="filters" class="filters" data-testid="filters" aria-label="Filter tasks">
        <div class="field">
          <label for="filter-status">Status</label>
          <select id="filter-status" name="status" data-testid="filter-status">
            <option value="">All statuses</option>
            <option value="ToDo">To Do</option>
            <option value="InProgress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-priority">Priority</label>
          <select id="filter-priority" name="priority" data-testid="filter-priority">
            <option value="">All priorities</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <button type="button" id="clear-filters" class="button button-secondary" data-testid="clear-filters">Clear filters</button>
      </form>

      <p id="task-count" class="task-count" data-testid="task-count"></p>
      <ul id="task-list" class="task-list" data-testid="task-list" aria-labelledby="tasks-heading"></ul>
      <p id="empty-state" class="empty-state" data-testid="empty-state" hidden>No tasks match the selected filters.</p>
    </section>
  </main>

  <!-- Cloned for each task. Values are set with textContent, never innerHTML, to prevent XSS. -->
  <template id="task-item-template">
    <li class="task-card" data-testid="task-item">
      <div class="task-card-header">
        <h3 class="task-title" data-testid="task-title"></h3>
        <span class="badge" data-testid="task-priority"></span>
      </div>
      <p class="task-meta">
        <span class="status-pill" data-testid="task-status-label"></span>
        <span class="task-assignee" data-testid="task-assignee"></span>
      </p>
    </li>
  </template>
</body>
</html>
